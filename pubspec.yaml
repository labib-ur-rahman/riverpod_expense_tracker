name: riverpod_expense_tracker
description: "A flutter project for tracking personal expenses using riverpod"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1
  
dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg